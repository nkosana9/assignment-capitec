# Default values for the rustfs chart.

# Root (admin) credentials. Must be overridden outside of local experiments.
accessKey: rustfsadmin

# Use a pre-created Secret instead. It must contain the keys: access-key, secret-key
existingSecret: ""

image:
  pullPolicy: IfNotPresent
  repository: rustfs/rustfs
  tag: "1.0.4"

nodeSelector: {}

persistence:
  accessMode: ReadWriteOnce
  enabled: true
  size: 1Gi
  storageClass: ""

# The RustFS image runs as uid/gid 10001. fsGroup makes the PVC writable by that user.
podSecurityContext:
  fsGroup: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Root (admin) secret, paired with accessKey above.
secretKey: rustfsadmin

service:
  apiPort: 9000
  consolePort: 9001
  type: ClusterIP
