{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.fullname" . }}
  labels:
    {{- include "rustfs.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ .Values.accessKey | quote }}
  secret-key: {{ .Values.secretKey | quote }}
{{- end }}
