apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Chart.Name }}-credentials"
  labels:
    {{- include "appLabels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "apiKey is required: pass --set-string apiKey=<value>, or set existingSecret" .Values.apiKey | quote }}
  link-signing-key: {{ required "linkSigningKey is required: pass --set-string linkSigningKey=<value>, or set existingSecret" .Values.linkSigningKey | quote }}
  s3-access-key: {{ .Values.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.s3.secretKey | quote }}
